<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>meme-r</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px system-ui, sans-serif; color: #111; background: #fff; }
    button, input, select { font: inherit; }
    button, .download { cursor: pointer; border: 1px solid #111; padding: .5rem; background: white; color: #111; }
    button:hover, .download:hover { background: #eee; }
    :focus-visible { outline: 3px solid #2674dc; outline-offset: 3px; }
    .app { display: flex; min-height: 100dvh; }
    aside { width: 220px; flex-shrink: 0; border-right: 2px solid; padding: 1rem; }
    aside > * { margin-bottom: 1rem; }
    h1 { font-size: 1.6rem; }
    h2 { font-size: 1.3rem; }
    label { display: flex; flex-direction: column; gap: .3rem; }
    input, select { max-width: 100%; padding: .3rem; }
    .tag-filters { display: flex; flex-direction: column; gap: .3rem; margin-top: .5rem; }
    .tag-filters label { flex-direction: row; align-items: center; overflow-wrap: anywhere; }
    main { flex: 1; min-width: 0; padding: 1rem; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: .6rem; }
    .card { min-width: 0; padding: 0; text-align: left; overflow: hidden; }
    .card img { display: block; width: 100%; height: 160px; object-fit: contain; background: #eee; }
    .card-info { display: flex; flex-direction: column; padding: .4rem; border-top: 1px solid; gap: .2rem; }
    .card-info span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .card-name { font-weight: bold; }
    .card-tags, .card-date { font-size: .85rem; color: #555; }
    dialog { width: min(90vw, 520px); max-height: 90dvh; overflow: auto; border: 2px solid; padding: 1rem; }
    dialog::backdrop { background: #0008; }
    form { display: flex; flex-direction: column; gap: .8rem; }
    .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .8rem; }
    #upload-preview, #preview-img { width: 100%; max-height: 60dvh; object-fit: contain; background: #eee; }
    #upload-preview { max-height: 200px; }
    #preview-name, #preview-tags { overflow-wrap: anywhere; }
    .error { color: #b00020; }
    [hidden] { display: none !important; }
    body.drag-over::after { content: "drop image here"; position: fixed; inset: 0; background: #000b; color: white; display: grid; place-items: center; pointer-events: none; font-size: 2rem; }
    @media (max-width: 600px) {
      .app { flex-direction: column; }
      aside { width: 100%; border-right: 0; border-bottom: 2px solid; }
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
  <script src="/static/meme-gallery.js" defer></script>
</head>
<body>
  <dialog id="add-modal" aria-labelledby="add-title">
    <h2 id="add-title">add a meme</h2>
    <form id="add-form">
      <label>name <input name="name" required></label>
      <label>image (GIF, PNG, JPEG, or WebP)
        <input type="file" name="file" accept="image/gif,image/png,image/jpeg,image/webp" required>
      </label>
      <img id="upload-preview" alt="upload preview" hidden>
      <label>tags (comma separated, optional) <input name="tags" placeholder="funny, cat, classic"></label>
      <p id="upload-status" class="error" role="alert"></p>
      <div class="actions">
        <button type="submit">save</button>
        <button type="button" data-close="add-modal">cancel</button>
      </div>
    </form>
  </dialog>
  <dialog id="preview-modal" aria-labelledby="preview-name">
    <img id="preview-img" alt="">
    <h2 id="preview-name"></h2>
    <p id="preview-tags"></p>
    <p id="preview-date"></p>
    <div class="actions">
      <a class="download" id="download-btn" download>download original</a>
      <button type="button" id="copy-btn">copy to clipboard</button>
      <button type="button" data-close="preview-modal">close</button>
    </div>
    <p id="copy-status" role="status"></p>
  </dialog>
  <div class="app">
    <aside>
      <h1>meme-r</h1>
      <button id="add-btn" type="button">upload meme</button>
      <label>search <input id="search-input" type="search" placeholder="title or tag..."></label>
      <details open>
        <summary>filter by tag (match any)</summary>
        <div class="tag-filters" id="tag-filters"></div>
      </details>
      <label>sort
        <select id="sort-input">
          <option value="date-new">newest first</option>
          <option value="date-old">oldest first</option>
          <option value="az">a → z</option>
          <option value="za">z → a</option>
        </select>
      </label>
    </aside>
    <main>
      <h2>the stash</h2>
      <p id="gallery-status" role="status">loading memes…</p>
      <button id="retry-btn" type="button" hidden>retry</button>
      <div class="gallery" id="gallery"></div>
    </main>
  </div>
</body>
</html>
